evidence:
  - {id: F01, source: C01, kind: figure, text: "North America quarterly revenue of $ 233 Mn supported by traction in differentiated assets."}
  - {id: F02, source: C02, kind: figure, text: "North America revenue of $167 million for the quarter, which included a small contribution from Lenalidomide."}
  - {id: F03, source: C03, kind: figure, text: "North America revenue Rs 1,485 crore, declining 22 per cent year-on-year due to ongoing lanreotide supply chain issues. Net profit slumps 57% to Rs 675 crore."}
  - {id: F04, source: C04, kind: figure, text: "North America revenue of $ 155 Mn supported by demand in differentiated portfolio ... North America delivered an annual revenue of $ 780 Mn."}
  - {id: F05, source: C05, kind: quote, text: "Guidance does not include any contribution from Lanreotide in FY '27. Lenalidomide revenues will continue to taper off, but this would be offset by new launches."}
  - {id: F06, source: C07, kind: figure, text: "The North America business was down 28 per cent year over year. Net profit fell 39% to Rs 789 crore; EBITDA margin 16.7% versus 25.6% a year earlier; FY27 EBITDA margin guidance of 18.5-20% maintained."}
  - {id: F07, source: C08, kind: figure, text: "North America revenue $162 million, below market expectations of $173 million. The company had lost its lanreotide product due to quality issues and lost exclusivity on lenalidomide in the previous quarter (Q4FY26); management asked that the decline be compared sequentially."}
  - {id: F08, source: C09, kind: claim, text: "Management expects significant movement in North America revenue in the coming quarters, with a target of a $1 billion exit run rate for the region."}
  - {id: F09, source: C10, kind: event, text: "The US drug regulator conducted an inspection at Pharmathen's Rodopi manufacturing facility in Greece between November 10 and 21, 2025, and issued nine inspectional observations in a Form 483. A redacted version of the form became public on 7 January. Cipla's Regulation 30 update dated 14 January 2026 said Lanreotide supply in the US will stay temporarily limited."}
  - {id: F10, source: C11, kind: quote, text: "Supply of its key US drug Lanreotide injection will remain constrained in the near term after its exclusive manufacturing partner Pharmathen International S.A. temporarily paused production. Lanreotide injection contributed about $135 million, accounting for roughly 15 per cent, to Cipla's US sales in 2024-25 (JPMorgan estimate); among the top three products in the US basket with ~22% market share; a worst-case import alert could impact FY27-FY28 earnings by 4-6 per cent."}
  - {id: F11, source: C12, kind: headline, text: "Cipla shares tank 5% after temporary halt of key drug production; resupply expected in the first half of FY2026-27."}
  - {id: F12, source: C13, kind: event, text: "Class II FDA recall of Cipla's lanreotide syringes, initiated 13 March 2026, over lack of sterility assurance at the contract site."}
  - {id: F13, source: C14, kind: context, text: "The FDA designated Pharmathen's manufacturing facility in Rodopi, Greece, as 'Official Action Indicated' (OAI)."}
  - {id: F14, source: C15, kind: headline, text: "Cipla warns of temporary lanreotide supply disruption after USFDA observations at supplier."}
  - {id: F15, source: C16, kind: figure, text: "Dr Reddy's North America revenue fell 35.38% YoY in Q1 FY27, mainly due to lower sales of Lenalidomide."}
  - {id: F16, source: C17, kind: figure, text: "Sun Pharma US formulation sales fell 9.7% to $427 million in Q1 FY27."}
  - {id: F17, source: C18, kind: context, text: "Settlements allowed volume-limited generic lenalidomide entry before unlimited entry on January 31, 2026."}
  - {id: F18, source: C11, kind: headline, text: "FDA observation to hit Lanreotide supply; Cipla may face earnings risk."}

