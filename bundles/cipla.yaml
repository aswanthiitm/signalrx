profile_text: >
  Pharmaceutical company with One India (branded prescription, trade generics,
  consumer health), North America generics and specialty (inhalation,
  peptide injectables, differentiated assets), South Africa and emerging
  markets, and API. Uses in-house plants and contract manufacturers.

