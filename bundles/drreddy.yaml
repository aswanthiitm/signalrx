profile_text: >
  Integrated pharmaceutical company. Reports Global Generics by geography
  (North America, Europe, India, Emerging Markets) plus Pharmaceutical Services
  & Active Ingredients (PSAI). Portfolio spans US generics, injectables,
  biosimilars, branded formulations in India and emerging markets, and an OTC /
  consumer health business including a nicotine replacement therapy (NRT) portfolio.

