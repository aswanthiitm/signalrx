evidence:
  - {id: E01, source: S01, kind: figure, text: "FY26 Global Generics by region (Rs million): North America 113,737 (down 22%); Emerging Markets 67,608 (up 23%); India 62,186 (up 16%); Europe 55,501 (up 55%). PSAI 34,774 (up 3%). Revenue Rs 335.9 billion, up 3.2%."}
  - {id: E02, source: S01, kind: figure, text: "Q4 FY26: consolidated revenue Rs 75,162 million, down 11.6% YoY. North America fell 51% to Rs 17,562 million; Emerging Markets up 29%, India up 20%, Europe up 14%. Excluding the Rs 4.5 billion shelf stock adjustment, FY26 revenue about Rs 340.5 billion."}
  - {id: E03, source: S01, kind: quote, text: "North America ... declined 22% for the full year ... largely due to lower Lenalidomide sales and a one-time shelf stock adjustment related to the product."}
  - {id: E04, source: S02, kind: figure, text: "FY21 quarterly segment tables (Rs million) Q1-Q4: North America 17,282 + 18,328 + 17,394 + 17,491; Europe 3,551 + 3,754 + 4,143 + 3,956; India 6,260 + 9,123 + 9,591 + 8,445; Emerging Markets 7,982 + 8,636 + 9,623 + 8,845; PSAI 8,553 + 8,505 + 7,009 + 7,915. North America generics business reached Rs. 70.5 billion for the year, up 9% YoY."}
  - {id: E05, source: S03, kind: figure, text: "North America: FY25 revenues at Rs 145.2 billion, YoY growth of 12%. The YoY growth was primarily driven by new product launches, increased volumes of select key products, partially offset by price erosion."}
  - {id: E06, source: S04, kind: figure, text: "Revenues 85,452 Mn [Up: 11% YoY; Flat QoQ]. North America 34,123 for Q1FY26, against 38,462 a year earlier ... decline primarily due to increased price erosion in certain key products including Lenalidomide. Europe Rs 12,744 million vs Rs 5,265 million, up 142%, primarily driven by contributions from the acquired NRT portfolio."}
  - {id: E07, source: S05, kind: figure, text: "Q1 FY27 (quarter ended 30 June 2026): revenue Rs 80,705 million, down 5.6% YoY. Emerging Markets Rs 18,328 million (up 31%); India Rs 17,177 million (up 17%); Europe Rs 14,440 million (up 13%); PSAI about Rs 852 crore (up about 4%)."}
  - {id: E08, source: S05, kind: quote, text: "A provision of Rs.2,397 million towards inventory and other associated costs, as certain batches of semaglutide were found to be out of specification due to an issue associated with the API."}
  - {id: E09, source: S06, kind: figure, text: "Revenue from the North America business fell 35.38% YoY to Rs 2,204.8 crore, mainly due to lower sales of Lenalidomide. Net profit plunged 69% YoY to Rs 444 crore."}
  - {id: E10, source: S07, kind: figure, text: "Consolidated revenue was about Rs 8,071 crore, up 6% year over year ... North America up 35% year over year on reported revenue."}
  - {id: E11, source: S07, kind: claim, text: "Management called the quarter an expected transition away from lenalidomide revenue ... Its underlying base business continued to deliver healthy double-digit growth across all key geographies."}
  - {id: E12, source: S07, kind: figure, text: "The FY27 supply target was cut to 6-7 million pens from 12 million; API testing completion targeted by the third week of September 2026 and commercial supply resumption in November; management put the probability of delivering 6-7 million pens between November and March at 80-90%."}
  - {id: E13, source: S08, kind: figure, text: "Revenue of Rs 80,705 million, a 6% decline year over year."}
  - {id: E14, source: S09, kind: figure, text: "Q1FY27 result update (SELL, target price 1,070): Europe Rs 1,444 crore, India Rs 1,718 crore."}
  - {id: E15, source: S10, kind: event, text: "Health Canada's Pharmaceutical Drugs Directorate issued a notice of non-compliance on the company's abbreviated new drug submission for semaglutide; analysts estimated a delay of at least eight to 12 months; the stock fell more than 4%."}
  - {id: E16, source: S11, kind: event, text: "Dr. Reddy's announced the launch of its generic semaglutide injection in Canada following a Notice of Compliance from Health Canada dated April 28, 2026."}
  - {id: E17, source: S12, kind: quote, text: "The active ingredient is made entirely in-house, while the finished product is currently manufactured in collaboration with OneSource."}
  - {id: E18, source: S13, kind: quote, text: "OneSource said its partner Dr. Reddy's received Health Canada authorization for a generic semaglutide injection; OneSource acts as the contract manufacturer, handling scale-up and commercial production at its US FDA-approved facility in Bengaluru."}
  - {id: E19, source: S14, kind: quote, text: "Certain batches of semaglutide were found to be out of specification due to an issue associated with the API ... the company is investigating the root cause ... commercial supplies of the product will be delayed for a certain period of time. The issue has no impact on patient safety and does not affect the product's existing global regulatory filings."}
  - {id: E20, source: S15, kind: headline, text: "Dr Reddy's delays semaglutide supply due to API issue; shares slide. NSE-listed shares dropped as much as 6.5% to 1,261.10 rupees."}
  - {id: E21, source: S16, kind: claim, text: "The fix is process remediation and does not require regulatory re-approvals; API supply to OneSource to resume by October 2026."}
  - {id: E22, source: S17, kind: claim, text: "An out-of-specification degradation impurity appeared during scale-up; the API itself met specifications and the impurity formed in the finished formulation."}
  - {id: E23, source: S18, kind: context, text: "Dr. Reddy's is described as OneSource's anchor customer."}
  - {id: E24, source: S19, kind: claim, text: "Management indicated that demand from other customers and markets was sufficient to absorb the available capacity."}
  - {id: E25, source: S20, kind: event, text: "Dr. Reddy's agreed to buy Haleon's non-US NRT brands, including Nicotinell, through a Swiss holding company, Northstar Switzerland SARL, for GBP 500 million (GBP 458 million upfront, up to GBP 42 million performance-based)."}
  - {id: E26, source: S21, kind: headline, text: "After Lenalidomide, Dr Reddy's turns to obesity drugs, biosimilars and consumer health."}
  - {id: E27, source: S22, kind: event, text: "Dr. Reddy's is also licensed to sell generic lenalidomide capsules in the U.S. without volume limitation beginning on January 31, 2026."}
  - {id: E28, source: S23, kind: figure, text: "Excluding the Rs 240 crore semaglutide provision, EBITDA margin would have been 15.4%."}
  - {id: E29, source: S24, kind: figure, text: "Sun Pharma US formulation sales fell 9.7% to $427 million in Q1 FY27."}
  - {id: E30, source: S25, kind: figure, text: "Cipla North America business was down 28 per cent year over year in Q1 FY27."}
  - {id: E31, source: S26, kind: figure, text: "The acquired NRT portfolio generated about GBP 217 million in revenue in CY23."}
  - {id: E32, source: S06, kind: headline, text: "Dr Reddys Labs slides after Q1 PAT plunges 69% YoY to Rs 444 crore."}

