profile_text: >
  Hospital network operating super-specialty hospitals with operational beds,
  occupancy and ARPOB as key metrics; payors include cash, insurance,
  international patients and institutional (CGHS/ECHS) patients; specialties
  include oncology, cardiac sciences, neurosciences, renal and orthopaedics;
  brownfield and greenfield bed expansion plus acquisitions.

