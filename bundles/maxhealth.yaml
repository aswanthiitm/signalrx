evidence:
  - {id: H01, source: M01, kind: quote, text: "Management attributed the oncology decline to the discontinuation of certain high-value chemotherapy drugs for institutional patients, a decision made in mid-Q3 of the prior fiscal year. Excluding oncology, gross revenue grew 20% year on year. Oncology's share of inpatient revenue fell to 22% from 26%. Management expects oncology growth to begin normalizing in Q3 FY2027 and be fully normalized by Q4 FY2027."}
  - {id: H02, source: M02, kind: quote, text: "The company's large CGHS and institutional business made it more exposed than peers to the discontinuation of high-value chemotherapy drugs."}
  - {id: H03, source: M03, kind: figure, text: "Excluding oncology, gross revenue grew 20% year on year."}
  - {id: H04, source: M04, kind: figure, text: "Gross revenue was Rs 2,982 crore, up 16% year on year, and operating EBITDA was Rs 704 crore, up 15%. Occupied bed days grew 10%. At Max Smart, 202 beds in the new tower were operational, with the remaining 198 due in Q2 FY27."}
  - {id: H05, source: M05, kind: figure, text: "Operational bed capacity increased by 630 net operational beds YoY to reach 5,379 operational beds by the end of June 2026. Bed occupancy was about 75%; ARPOB increased to Rs 81.9k, up 5% year on year. Net debt Rs 2,384 crore, expected to rise by FY27 on capex."}
  - {id: H06, source: M06, kind: figure, text: "Profit after tax was Rs 357 crore, up 3%."}
  - {id: H07, source: M07, kind: figure, text: "Operational bed capacity went up from 4,654 beds at end of FY25 to 4,966 beds at end of FY26. Overall occupancy stood at 76% in FY26 vs 74% in FY25. Q4: bed occupancy remained at 75%, occupied bed days grew 8%; ARPOB stayed broadly flat at INR 77.9k."}
  - {id: H08, source: M08, kind: figure, text: "Revenue rose 10% YoY to Rs 2,608 Cr; network operating EBITDA grew 4% to Rs 648 Cr; occupancy 74% (down from 75% YoY and 77% QoQ); ARPOB Rs 77,900, up from Rs 75,900 in the same quarter last year."}
  - {id: H09, source: M09, kind: quote, text: "Operating margin fell to 26.1% from 27.3%, driven by the discontinuation of high-value patented chemotherapy drugs for institutional patients after restrictive pricing guidelines from the Central Government Health Scheme (CGHS), and pre-commissioning expenses for new capacity. Recent revisions to CGHS tariffs are expected to have a sustained positive impact of approximately INR 140 crores annually, with the full benefit expected from Q1 FY27. ARPOB Rs 77,900, up 2.6% YoY."}
  - {id: H10, source: M10, kind: claim, text: "Revenue from oncology declined because certain high-value, low-margin chemo drugs were discontinued after CGHS pricing changes. Management has been in ongoing discussions with the government over below-cost supply requirements and expects the impact to be structural unless terms improve."}
  - {id: H11, source: M11, kind: event, text: "The CGHS wing told empanelled hospitals to either accept medicines CGHS supplies or provide a purchase invoice for them (December 2024 order). AHPI planned to ask the government to withdraw the order, saying it squeezes hospital margins, particularly in high-cost cancer treatment."}
  - {id: H12, source: M12, kind: event, text: "The Ministry of Health and Family Welfare issued the office memorandum on October 3, 2025; revised CGHS package rates for nearly 2,000 procedures took effect October 13, 2025. Cancer surgeries continue under the old rules, but chemotherapy, radiotherapy and related tests now follow the revised rates."}
  - {id: H13, source: M13, kind: context, text: "Centre revises CGHS rates; first major revamp since 2014; hospitals welcome tier-based structure."}
  - {id: H14, source: M14, kind: figure, text: "The company is planning to scale up its bed capacity from 5,000 in FY25 to 9,000-9,500 by FY28; on track to add over 3,000 beds between FY26 and FY28 (~2,100 brownfield and 900 greenfield); about 6,769 beds projected at end-FY27."}
  - {id: H15, source: M15, kind: quote, text: "By 2028, it will go up to about 9,500, said Soi."}
  - {id: H16, source: M16, kind: claim, text: "Max Healthcare has announced a Rs 6,000 crore plan to add over 10,000 beds across India within two to four years, funded entirely through internal cash."}
  - {id: H17, source: M17, kind: figure, text: "Project timelines: Max Smart 400-bed tower 50% operational, rest in current quarter; 100 beds Max Lucknow (next two quarters); 500 beds Sector 56 Gurgaon (phased by year-end); 250 beds Bhubaneswar (renovation within 12 months); 100 beds Nagpur (by FY28); 400 beds Zirakpur, Mohali (by FY28)."}
  - {id: H18, source: M18, kind: event, text: "In Nagpur, a 170-bed expansion is in progress, with 12 beds already commissioned; the remaining beds are pending environmental clearance. The 550-bed Vikrant Saket project is awaiting forest department clearance, with completion expected by FY28."}
  - {id: H19, source: M19, kind: figure, text: "Apollo Q1 FY27: occupancy rose to 70% from 65%; average revenue per patient rose 8% driven by favorable case mix and specialty growth."}
  - {id: H20, source: M20, kind: figure, text: "The Delhi-based hospital chain posted a net profit of Rs 301 crore in Q3, up 26%."}
  - {id: H21, source: M08, kind: figure, text: "PAT increased by 9% to Rs 344 Cr."}
  - {id: H22, source: M21, kind: headline, text: "Max Health stock hits a 52-week low as margins face pressure; price caps listed as a risk."}
  - {id: H23, source: M22, kind: headline, text: "Apollo scores over Max with a strong revenue, margin outperformance in Q1."}
  - {id: H24, source: M09, kind: context, text: "Reported PAT of Rs 344 crore included a one-time labour provision of Rs 55 crore; adjusted PAT Rs 399 crore."}

